name: fork-461
on:
  push:
    branches: [ci/fork-461]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - working-directory: ./web
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test
